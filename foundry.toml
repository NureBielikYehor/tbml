[profile.default]
src = "contracts"
test = "tests/solidity"
out = "artifacts/foundry"
cache_path = "cache/foundry"
libs = ["node_modules"]
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]
solc = ".tools/bin/solc"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true
